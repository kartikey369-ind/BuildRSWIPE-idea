name: Daily README Update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update status
        run: |
          STATUSES=(
            "📝 Documentation updated"
            "🔧 Project maintenance"
            "♻️ Codebase cleanup"
            "📚 README improvements"
            "⚡ Performance review"
            "🧹 Repository housekeeping"
            "🔍 Reviewing project structure"
            "📦 Dependency audit"
            "✨ Minor improvements"
            "🚀 Continuous development"
            "🛠️ Internal refactoring"
            "✅ Quality checks completed"
          )

          RANDOM_STATUS=${STATUSES[$RANDOM % ${#STATUSES[@]}]}

          sed -i "/<!--STATUS_START-->/,/<!--STATUS_END-->/c\\<!--STATUS_START-->\\${RANDOM_STATUS}\\<!--STATUS_END-->" README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "docs: daily project update"
            git push
          fi
